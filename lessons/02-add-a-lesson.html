<p>對 AI 只需要說一句話，它會依 CLAUDE.md 第 4 節自動完成。</p>
<pre><code>請依 CLAUDE.md 新增第 03 堂：Prompt 基礎</code></pre>
<div class="key"><p>AI 會複製 <code>_template.html</code>、命名為 <code>03-prompt-basics.html</code>，並更新首頁目錄與上下頁連結。</p></div>

<h2>驗收</h2>
<p>檢查連結、標題層級、是否有行內樣式。這些都寫在規則裡，AI 也會自己檢查。</p>
